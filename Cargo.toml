[package]
name = "d20calc"
version = "0.1.0"
edition = "2024"

[dependencies]
rodio = { version = "0.23.0", default-features = false, features = ["playback", "symphonia-mp3"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "unstable-winit-030", "image-default-formats", "software-renderer-systemfonts"] }

[build-dependencies]
slint-build = "1.18.1"
winresource = "0.1.34"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
png = "0.18.1"
